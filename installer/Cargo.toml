[package]
name = "musikpl-setup"
version = "3.4.0"
edition = "2021"
description = "Installs MusiKPL for the current user, and updates it"
publish = false

[[bin]]
name = "MusiKPL-Setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[build-dependencies]
# logo.svg becomes the exe, window and tray icon (build_icon.rs).
resvg = { version = "0.37", default-features = false }
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading"] }
