[package]
name = "ytmusic"
version = "0.1.0"
edition = "2021"
description = "A native, audio-only YouTube player powered by mpv and yt-dlp"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true
