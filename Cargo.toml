[package]
name = "MusiKPL"
version = "2.2.0"
edition = "2021"
description = "A native, audio-only YouTube player powered by mpv and yt-dlp"

[[bin]]
name = "MusiKPL"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["svg", "http", "image"] }
# Decoders for cover art loaded by egui_extras (YouTube thumbnails, Last.fm album art).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Last.fm API calls (blocking, on worker threads) and their request signatures.
ureq = "2"
md5 = "0.7"
# Internet Jams: encrypted peer-to-peer connections dialed by public key,
# with relay fallback. The async runtime starts only for internet Jams.
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# Invite codes (already in the dependency tree through ureq).
base64 = "0.22"
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell"] }
# Unpacks the mpv and yt-dlp bundled into release builds (already used by
# the image decoders, pure Rust).
miniz_oxide = "0.8"

[build-dependencies]
miniz_oxide = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true

# Compressing the bundled tools in build.rs is slow without optimizations.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
