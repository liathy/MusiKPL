[package]
name = "MusiKPL"
version = "3.4.0"
edition = "2021"
description = "A native, audio-only YouTube player powered by mpv and yt-dlp"
license = "GPL-3.0-or-later"

# The setup (installer/) builds separately: scripts/build-release.ps1.
[workspace]
members = [".", "core", "installer", "mobile"]
resolver = "2"

[[bin]]
name = "MusiKPL"
path = "src/main.rs"

[dependencies]
# Everything that isn't drawing or Windows/Linux-specific: shared with Android.
musikpl-core = { path = "core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["svg", "http", "image", "file"] }
# Decoders for covers loaded by egui_extras (YouTube thumbnails, playlist photos);
# the JPEG encoder saves playlist photos.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Last.fm API calls (blocking, on worker threads) and their request signatures.
ureq = "2"
md5 = "0.7"
# Internet Jams: encrypted peer-to-peer connections dialed by public key,
# with relay fallback. The async runtime starts only for internet Jams.
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# Invite codes (already in the dependency tree through ureq).
base64 = "0.22"
raw-window-handle = "0.6"
# Unpacks the mpv and yt-dlp bundled into release builds (already used by
# the image decoders, pure Rust).
miniz_oxide = "0.8"
# Checks Windows fallback fonts before egui loads them (already used by egui).
ab_glyph = "0.2"

[dev-dependencies]
# Tests keep their data in a temporary folder, never the user's.
musikpl-core = { path = "core", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader"] }

[build-dependencies]
# logo.svg becomes the exe, window and tray icon (build_icon.rs).
resvg = { version = "0.37", default-features = false }
embed-resource = "3"
miniz_oxide = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true

# Test builds (scripts\build-release.ps1 -Quick): release behaviour, built
# much faster, without whole-program optimization. Releases use [profile.release].
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Compressing the bundled tools in build.rs is slow without optimizations.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
